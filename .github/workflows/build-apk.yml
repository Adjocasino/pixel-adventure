name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Use the Android SDK that comes preinstalled on the runner
      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CottageMeadow.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cat > notes.md <<EOF
          **Cottage Meadow v${VER}** (build ${{ github.run_number }}) — download **CottageMeadow.apk** below and install it.

          The first official version:
          - Mirror Lake rhythm fishing (catch chart: fish + Iron → Gold tiers)
          - Fruit Catch under the big mango tree (physics bilao, wind, fruit storm)
          - Barn Ranch with Ginger and Rocky (storage box outside the barn)
          - Music picker in Settings (8-bit and piano / harp songs)
          - LAN multiplayer (same hotspot or Wi-Fi): walk together, Fruit Catch co-op and versus, barn together
          - New cottage app icon

          Commit ${{ github.sha }}.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "build-${{ github.run_number }}" CottageMeadow.apk \
            --repo "${{ github.repository }}" \
            --title "Cottage Meadow v${VER} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
