name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Use the Android SDK that comes preinstalled on the runner
      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Load the permanent signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cottage.jks"
            echo "CM_KEYSTORE=$RUNNER_TEMP/cottage.jks" >> "$GITHUB_ENV"
            echo "CM_KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Signing with the permanent key"
          else
            echo "::error::SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets are missing; refusing to build an APK that cannot update."
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CottageMeadow.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cat > notes.md <<EOF
          **Cottage Meadow v${VER}** (build ${{ github.run_number }}) — download **CottageMeadow.apk** below and install it.

          New in v1.6:
          - Play together only side by side: Co-op / Versus at the mango tree and Barn Together at the clipboard show up when your friend stands next to you; everything else you do freely on your own
          - Fishing: your friend sees "<name> caught a ... !" when you finish
          - Fishing pauses if you switch apps mid-song
          - Multiplayer warns when the two phones have different game versions
          - Cheap-item prices recover while you play (changing the phone clock does nothing)
          - Installs over v1.5 and keeps your save

          v1.5:
          - Updates now install over the old app and keep your save (permanent signing key).
            One last time: uninstall the old Cottage Meadow, then install this. After this, just install updates.
          - Fishing fix: no more silent start and sudden speed-up (steady game clock, music scheduled as it plays)
          - Fruit Catch: faint solo, or everyone down in co-op, and the fruit is lost
          - New cottage in Willow Village that matches the app icon; no chickens in the front yard
          - The Kid is removed from character select (Inad and Adjo)

          v1.4:
          - Sell eggs (from the barn storage) and fruit (from your bag) to Bins at the animal shop
          - Cheap items lose value the more you sell them (demand drops 15% per item, recovers over ~10 min); valuable items keep full price
          - Fish stall uses the same demand rule for cheap fish

          v1.3:
          - Animal unlocks at Bins' shop: Duck (own 3 chickens), Cow (own 4 chickens), Goat (finish 5 barn shifts), Bees (get a golden egg)
          - The shop shows each goal and your progress; unlocked animals become buyable once their barn task is added

          v1.2:
          - Market Square (west of Willow Village): sell fish at the fish stall, Jao hangs around with his quotes
          - Bins' animal shop: buy chickens and name them; they join Ginger and Rocky in the barn (Turon says hi)
          - Coins (shown in the bag)

          Also in this version (since v1.0):
          - Mirror Lake rhythm fishing (catch chart: fish + Iron → Gold tiers)
          - Fruit Catch under the big mango tree (physics bilao, wind, fruit storm)
          - Barn Ranch with Ginger and Rocky (storage box outside the barn)
          - Music picker in Settings (8-bit and piano / harp songs)
          - LAN multiplayer (same hotspot or Wi-Fi): walk together, Fruit Catch co-op and versus, barn together
          - New cottage app icon

          Commit ${{ github.sha }}.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "build-${{ github.run_number }}" CottageMeadow.apk \
            --repo "${{ github.repository }}" \
            --title "Cottage Meadow v${VER} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
