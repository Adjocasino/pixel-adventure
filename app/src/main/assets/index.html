<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Adventure</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#13221d;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:"Trebuchet MS",Verdana,sans-serif}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#ui *{pointer-events:auto}
#area{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 18px;border-radius:20px;background:rgba(20,35,30,.45);font-weight:bold;letter-spacing:1px;font-size:15px;opacity:0;transition:opacity .6s;pointer-events:none!important;white-space:nowrap}
#area.show{opacity:1}
#topr{position:absolute;right:12px;top:10px;display:flex;gap:8px}
#topr button{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:18px;font-weight:bold;text-shadow:0 1px 0 rgba(0,0,0,.4)}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.28);pointer-events:none!important;transition:opacity .2s;opacity:.55}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.30);border:2px solid rgba(255,255,255,.5)}
.pbtn{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;pointer-events:none!important}
.pbtn small{position:absolute;bottom:-18px;font-size:11px;font-weight:normal;opacity:.8}
.pbtn.on{background:rgba(255,255,255,.35)}
#bE{position:absolute;width:58px;height:30px;border-radius:16px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.38);pointer-events:none!important;background-repeat:no-repeat;background-position:center;background-size:auto 22px;image-rendering:pixelated}
#bE.on{background-color:rgba(255,255,255,.35)}
#msg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(70vw,520px);padding:10px 16px;border-radius:12px;background:rgba(20,30,28,.78);border:2px solid rgba(255,255,255,.25);font-size:15px;line-height:1.35;opacity:0;transition:opacity .25s;pointer-events:none!important;text-align:center}
#msg.show{opacity:1}
#menu{position:absolute;inset:0;background:rgba(10,20,18,.55);display:none;align-items:center;justify-content:center}
#menu.show{display:flex}
#menu .panel{background:rgba(25,45,38,.92);border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:14px 16px;min-width:260px}
#menu h3{margin:0 0 10px;text-align:center;letter-spacing:2px}
#menu .maps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#menu button{font:inherit;color:#fff;font-weight:bold;padding:12px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);text-shadow:inherit}
#menu button.cur{background:rgba(120,200,140,.35)}
#menu .close{display:block;margin:12px auto 0;padding:8px 22px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cde;font-size:16px;letter-spacing:2px}
</style>
</head>
<body>
<div id="load">LOADING…</div>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="area"></div>
  <div id="topr"><button id="bMap" aria-label="Travel">⌖</button><button id="bSnd" aria-label="Sound">♪</button></div>
  <div id="joy"><div id="knob"></div></div>
  <div class="pbtn" id="bB">B<small>run</small></div>
  <div class="pbtn" id="bA">A<small>action</small></div>
  <div id="bE" aria-label="Emote"></div>
  <div id="msg"></div>
  <div id="menu"><div class="panel"><h3>TRAVEL</h3><div class="maps" id="maps"></div><h3 style="margin-top:14px">CHARACTER</h3><div class="maps" id="chars"></div><button class="close" id="mClose">Close</button></div></div>
</div>
<script>
'use strict';
/* ==================================================================
   PIXEL ADVENTURE — 16-bit sandbox. All art is generated in code.
   ================================================================== */
const TS=16,MW=48,MH=28;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let VW=400,VH=224;

/* ---------------- utils / noise ---------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const C=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const P=a=>a.map(C);
function hash(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){return vnoise(x,y,s)*.5+vnoise(x*2,y*2,s+1)*.3+vnoise(x*4,y*4,s+2)*.2;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
function pick(pal,v,x,y){v=clamp(v,0,.9999);const f=v*(pal.length-1),lo=f|0;return pal[(f-lo)>BAY[((y&3)<<2)|(x&3)]?lo+1:lo];}

/* ---------------- palettes ---------------- */
const PAL={
  grass:P(['#3a8660','#449264','#4f9f6b','#5cac72','#6db87a','#83c685']),
  forest:P(['#1b4036','#214a3d','#285645','#30624c','#3a6f55']),
  sand:P(['#cdb276','#d9c085','#e4cd95','#eed9a7','#f5e5bb']),
  dirt:P(['#6f4f34','#7e5b3b','#8e6844','#9f774f','#b0875c']),
  water:P(['#285f8a','#2f6f9b','#3881ab','#4495bd','#5aaacb','#7fc3da']),
  plank:P(['#5e3d25','#74502f','#8a6139','#a07345','#b48452']),
  till:P(['#5a3d28','#69482f','#7a5638','#8a6342']),
  leaf:P(['#1d4c3d','#245b46','#2e6c4e','#3b8058','#4f9462','#6aab6e','#8bc47c']),
  leafF:P(['#12322b','#183d33','#1f4a3b','#285944','#336a4e','#447d59','#5a9264']),
  leafA:P(['#5c2a1f','#7a3b25','#9c522c','#bd6c33','#d68c41','#e8ae58','#f2cd7c']),
  trunk:P(['#35231b','#4a3125','#5e3f2e','#775139','#8f6646','#a87c55']),
  stone:P(['#4d5260','#5f6575','#737a8a','#8a90a0','#a4aab6','#c3c7cf']),
  wood:P(['#4a2e1c','#603d25','#7a4f30','#93643d','#ab7a4c','#c39463']),
  roof:P(['#262b37','#30374a','#3b4459','#48536b','#58657e']),
  wall:P(['#d6c08c','#e3cf9e','#eedcb0','#f6e8c4']),
};
const SHADOW='rgba(14,36,32,0.30)';

/* ---------------- pixel buffers ---------------- */
function buf(w,h){return{w,h,d:new Uint8ClampedArray(w*h*4)};}
function sp(b,x,y,c,a=255){x|=0;y|=0;if(x<0||y<0||x>=b.w||y>=b.h)return;const i=(y*b.w+x)*4;b.d[i]=c[0];b.d[i+1]=c[1];b.d[i+2]=c[2];b.d[i+3]=a;}
function ga(b,x,y){if(x<0||y<0||x>=b.w||y>=b.h)return 0;return b.d[(y*b.w+x)*4+3];}
function R_(b,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)sp(b,x+i,y+j,c);}
function outline(b,k=.4){const{w,h,d}=b,o=new Uint8ClampedArray(d);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(d[i+3])continue;
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const j=(Y*w+X)*4;
      if(d[j+3]>128){o[i]=d[j]*k;o[i+1]=d[j+1]*k;o[i+2]=Math.min(255,d[j+2]*k*1.15+6);o[i+3]=255;break;}}}
  b.d=o;}
function cvs(b){const c=document.createElement('canvas');c.width=b.w;c.height=b.h;c.getContext('2d').putImageData(new ImageData(b.d,b.w,b.h),0,0);return c;}
function flipC(c){const n=document.createElement('canvas');n.width=c.width;n.height=c.height;const g=n.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return n;}
function blobs(b,L,pal,seed,ao,aoL,x0=0,y0=0,x1=b.w,y1=b.h){
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let best=0,q=null;
    for(const o of L){const dx=x-o.x,dy=(y-o.y)*(o.sy||1),hh=1-Math.sqrt(dx*dx+dy*dy)/o.r;if(hh>best){best=hh;q=o;}}
    if(!q||(best<.09&&hash(x,y,seed)<.45))continue;
    const nx=(x-q.x)/q.r,ny=(y-q.y)/q.r;
    let v=.55-(nx*.5+ny*.7)*.55+(vnoise(x*.42,y*.42,seed)-.5)*.38+(q.v||0)+(best<.18?-.12:0);
    if(ao!=null)v-=Math.max(0,y-ao)/aoL*.4;
    sp(b,x,y,pick(pal,v,x,y));}
}

/* ---------------- sprite generators ---------------- */
function makeTree(seed,pal,cr=22,th=24){
  const R=rng(seed),w=cr*2+24,h=Math.round(cr*2+th+8),b=buf(w,h),cx=w>>1,cy=cr+4,by=h-3,trunk=PAL.trunk;
  for(let y=cy+2;y<=by;y++){const t=(y-cy-2)/(by-cy-2),half=3+t*t*t*5.5;
    for(let x=Math.round(cx-half);x<=Math.round(cx+half);x++){const lx=(x-(cx-half))/(2*half);sp(b,x,y,pick(trunk,.9-lx*.75+(vnoise(x*.8,y*.1,seed)-.5)*.5,x,y));}}
  for(const s of[-1,1])for(let i=0;i<4;i++)sp(b,cx+s*(6+i),by-(i>2?0:1),pick(trunk,s<0?.6:.3,i,by));
  const L=[{x:cx,y:cy,r:cr*.95}],n=8+(R()*3|0);
  for(let i=0;i<n;i++){const a=i/n*6.283+R()*.5,d=cr*(.5+R()*.18);L.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d*.85,r:cr*(.4+R()*.12),v:(R()-.5)*.1});}
  L.push({x:cx-cr*.25,y:cy-cr*.45,r:cr*.42,v:.06});
  blobs(b,L,pal,seed,cy+cr*.15,cr*1.1,0,0,w,Math.min(by-6,cy+cr*1.3));
  outline(b,.36);
  return{c:cvs(b),ox:cx,oy:by,cr,top:cy-cr,w,h};
}
function makeBush(seed,pal,berry){
  const R=rng(seed),b=buf(28,22),L=[];
  for(let i=0;i<5;i++)L.push({x:8+R()*12,y:9+R()*5,r:6+R()*2.5});
  blobs(b,L,pal,seed,13,10);
  if(berry)for(let i=0;i<6;i++){const x=6+R()*16|0,y=6+R()*9|0;if(ga(b,x,y)){sp(b,x,y,C('#d6455a'));sp(b,x,y-1,C('#f28a96'));}}
  outline(b,.36);return{c:cvs(b),ox:14,oy:19};
}
function makeRock(seed){
  const R=rng(seed),b=buf(24,19);
  const L=[{x:12,y:10,r:9,sy:1.25},{x:7.5,y:11,r:6,sy:1.3},{x:15.5,y:9,r:6.5,sy:1.2}];
  blobs(b,L,PAL.stone,seed,12,8);
  for(let y=0;y<12;y++)for(let x=0;x<24;x++)if(ga(b,x,y)&&!ga(b,x,y-2)&&vnoise(x*.5,y*.5,seed+4)>.5)sp(b,x,y,pick(PAL.leaf,.55,x,y));
  if(R()<.6){for(let i=0;i<4;i++)sp(b,10+i,8+(i>>1),C('#4d5260'));}
  outline(b,.4);return{c:cvs(b),ox:12,oy:16};
}
function makeStump(){const b=buf(20,16),t=PAL.trunk;
  for(let y=6;y<14;y++)for(let x=3;x<17;x++)sp(b,x,y,pick(t,.85-(x-3)/14*.7+(vnoise(x,y*.2,3)-.5)*.4,x,y));
  for(let y=2;y<9;y++)for(let x=2;x<18;x++){const dx=(x-9.5)/7.5,dy=(y-5.5)/3.3,d=dx*dx+dy*dy;if(d<=1)sp(b,x,y,pick(PAL.wood,d>.75?.35:(Math.sqrt(d)*7|0)%2?.8:.95,x,y));}
  sp(b,2,13,t[2]);sp(b,17,13,t[1]);outline(b,.38);return{c:cvs(b),ox:10,oy:14};}
function makeFern(seed,sw,pal=PAL.leaf){
  const R=rng(seed),b=buf(20,18);
  for(let i=0;i<7;i++){const a=(i-3)/3*1.05+(R()-.5)*.25,len=8+R()*5,bx=10+(i-3)*.8,curl=(a>0?1:-1)*(.5+R()*.5);
    for(let t=0;t<=1;t+=.05){const aa=a+curl*t*t,x=bx+Math.sin(aa)*len*t+sw*t*t*2,y=16-Math.cos(aa)*len*t;
      sp(b,x,y,pick(pal,.35+t*.55+(i%2)*.1,x|0,y|0));if(t<.4)sp(b,x+1,y,pick(pal,.3+t*.5,x|0,y|0));}}
  outline(b,.42);return{c:cvs(b),ox:10,oy:16};
}
function makeReeds(seed,sw){
  const R=rng(seed),b=buf(16,24);
  for(let i=0;i<5;i++){const bx=3+i*2.4+R(),len=12+R()*8,lean=(R()-.5)*.3;
    for(let t=0;t<=1;t+=.04){const x=bx+lean*len*t+sw*t*t*2,y=22-len*t;sp(b,x,y,pick(PAL.leaf,.3+t*.6,x|0,y|0));}
    if(i%2===0){const x=bx+lean*len+sw*2,y=22-len;R_(b,x|0,(y|0)+1,2,4,C('#7a4a2a'));sp(b,x,y+1,C('#9a6438'));}}
  outline(b,.42);return{c:cvs(b),ox:8,oy:22};
}
function makeMushroom(seed){const b=buf(10,10),r=hash(seed,1,1)<.5;const cap=r?P(['#8e2c2c','#b8403a','#d85d4f','#ee8a72']):P(['#7a5a3a','#9a7448','#b8905c','#d2ae78']);
  R_(b,4,5,3,4,C('#efe3cc'));sp(b,4,5,C('#d4c4a8'));
  for(let y=1;y<6;y++)for(let x=1;x<9;x++){const dx=(x-4.5)/4,dy=(y-5)/4;if(dx*dx+dy*dy<=1)sp(b,x,y,pick(cap,.8-dx*.4-dy*.3,x,y));}
  if(r){sp(b,3,3,C('#fff3e8'));sp(b,6,2,C('#fff3e8'));sp(b,7,4,C('#fff3e8'));}
  outline(b,.4);return{c:cvs(b),ox:5,oy:9};}
function makeFenceH(){const b=buf(18,18),w=PAL.wood;
  for(let x=0;x<18;x++){sp(b,x,5,w[4]);sp(b,x,6,w[2]);sp(b,x,12,w[4]);sp(b,x,13,w[2]);}
  for(let i=0;i<=1;i+=1/12){const x=2+i*14|0;sp(b,x,7+i*4|0,w[3]);sp(b,x,11-i*4|0,w[3]);}
  R_(b,1,2,3,14,w[3]);R_(b,1,2,1,14,w[4]);sp(b,2,1,w[4]);
  outline(b,.4);return{c:cvs(b),ox:9,oy:15};}
function makeFenceV(){const b=buf(9,22),w=PAL.wood;R_(b,3,0,2,20,w[2]);R_(b,3,0,1,20,w[3]);R_(b,2,6,4,14,w[3]);R_(b,2,6,1,14,w[4]);sp(b,3,5,w[4]);sp(b,4,5,w[3]);
  outline(b,.4);return{c:cvs(b),ox:4,oy:20};}
function makeLamp(){const b=buf(14,42),ir=P(['#262a33','#353b47','#4a5262','#626c7e']),g=C('#ffe59a'),g2=C('#ffd062');
  R_(b,6,12,2,26,ir[1]);R_(b,6,12,1,26,ir[3]);R_(b,4,36,6,4,ir[1]);R_(b,4,36,6,1,ir[3]);
  R_(b,3,3,8,9,ir[0]);R_(b,4,4,6,7,g2);R_(b,5,5,3,4,g);R_(b,2,2,10,2,ir[2]);R_(b,4,0,6,2,ir[1]);sp(b,6,12,ir[0]);
  outline(b,.4);return{c:cvs(b),ox:7,oy:39};}
function makeSign(){const b=buf(18,22),w=PAL.wood;R_(b,8,10,2,11,w[2]);R_(b,8,10,1,11,w[3]);
  for(let y=2;y<11;y++)for(let x=1;x<17;x++)sp(b,x,y,pick(w,(y===2?.95:.7)-(x/16)*.25,x,y));
  for(const y of[5,8])for(let x=4;x<14;x++)if(hash(x,y,7)<.75)sp(b,x,y,w[0]);
  outline(b,.4);return{c:cvs(b),ox:9,oy:20};}
function makeBarrel(){const b=buf(16,18),w=PAL.wood,ir=C('#3a3640');
  for(let y=1;y<16;y++){const half=5+Math.sin((y-1)/15*Math.PI)*1.5;for(let x=Math.round(8-half);x<Math.round(8+half);x++)sp(b,x,y,pick(w,.9-(x-8+half)/(2*half)*.7,x,y));}
  for(const y of[3,12])for(let x=2;x<14;x++)if(ga(b,x,y))sp(b,x,y,ir);
  for(let x=4;x<12;x++)sp(b,x,1,w[1]);outline(b,.4);return{c:cvs(b),ox:8,oy:16};}
function makeCrate(){const b=buf(16,16),w=PAL.wood;R_(b,1,3,14,12,w[3]);R_(b,1,1,14,3,w[5]);
  for(const x of[1,14])R_(b,x,3,1,12,w[1]);for(let i=0;i<12;i++)sp(b,2+i,3+i,w[1]);R_(b,1,8,14,1,w[2]);
  outline(b,.4);return{c:cvs(b),ox:8,oy:14};}
function makeHay(seed){const b=buf(30,22),pal=P(['#9a7a2c','#b8922f','#d1ab3e','#e3c45a','#f0da86']);
  blobs(b,[{x:15,y:13,r:12,sy:1.5},{x:10,y:12,r:8,sy:1.3},{x:20,y:12,r:8,sy:1.3}],pal,seed,14,8);
  for(let i=0;i<30;i++){const x=hash(i,seed,2)*28|0,y=hash(i,seed,3)*18|0;if(ga(b,x,y)&&ga(b,x,y+1))sp(b,x,y,pal[4]);}
  outline(b,.4);return{c:cvs(b),ox:15,oy:20};}
function makeScarecrow(){const b=buf(22,34),w=PAL.wood;R_(b,10,12,2,21,w[2]);R_(b,2,14,18,2,w[3]);
  const sh=P(['#7a3a3a','#9c4a44','#b85e50']);for(let y=13;y<24;y++)for(let x=6;x<16;x++)sp(b,x,y,pick(sh,.8-(x-6)/10*.6,x,y));
  for(let x=3;x<19;x++)sp(b,x,15,sh[1]);R_(b,7,22,8,2,C('#d1ab3e'));
  for(let y=4;y<12;y++)for(let x=7;x<15;x++){const dx=(x-10.5)/4,dy=(y-8)/4;if(dx*dx+dy*dy<=1)sp(b,x,y,C('#e8d6a8'));}
  sp(b,9,8,C('#2b2233'));sp(b,12,8,C('#2b2233'));for(let x=9;x<13;x++)sp(b,x,10,C('#8a6a4a'));
  const hat=P(['#4a3a2a','#6a523a','#8a6a4a']);R_(b,4,4,14,2,hat[1]);R_(b,7,0,8,4,hat[2]);R_(b,7,3,8,1,C('#b8403a'));
  outline(b,.4);return{c:cvs(b),ox:11,oy:32};}

  const ch=CHARS[pl.char],set=ch.set[pl.dir];let s,lift=0;
  if(pl.riding){s=ch.ride[pl.dir][(T>>3)%4];lift=2+Math.round(Math.sin(T/8));}
  else if(pl.emote&&ch.extra&&pl.dir==='down'&&!pl.moving){const e=pl.emote;s=e>=22&&e<36?ch.extra.reachR:e>=50&&e<64?ch.extra.reachL:e<92&&(T+40)%230>=7?ch.extra.look:set.idle[0];}
  else if(pl.moving)s=set.walk[Math.floor(pl.anim)%4];else{const ph=(T+40)%230;s=ph<7&&pl.dir!=='up'?set.idle[2]:set.idle[(T>>5)%2];}
  const e=pl.emote,hop=e>=24&&e<34?Math.round(3*Math.sin((e-24)/10*Math.PI)):e>=52&&e<62?Math.round(3*Math.sin((e-52)/10*Math.PI)):0;
  const x=Math.round(pl.x-cx-(s.width>>1)),y=Math.round(pl.y-cy-(s.height-1)-hop-lift);
  if(pl.act>0&&pl.dir==='up')drawSwing(cx,cy);
  ctx.drawImage(s,x,y);
  if(pl.act>0&&pl.dir!=='up')drawSwing(cx,cy);
}
function drawEmote(cx,cy){
  // two jellyfish: the character hops at each one, and each one dodges away, then they swirl and float off
  const t=pl.emote,px=pl.x-cx,py=pl.y-cy,ease=k=>1-Math.pow(1-Math.min(1,Math.max(0,k)),3);
  const pop=Math.min(1,t/8),fade=t>92?(110-t)/18:1;
  const jel=(bx,by,dt,dir,ph)=>{let x=px+bx+Math.sin(t/9+ph)*2,y=py+by+Math.sin(t/5+ph)*1.5;const k=(t-dt)/7;
    if(t>=dt){x+=dir*18*ease(k);y-=8*ease(k);if(t>=dt+16){const k2=(t-dt-16)/12;x-=dir*13*ease(k2);y+=4*ease(k2);}}return[x,y,t>=dt&&k<1?dir:0];};
  let A=jel(-22,-40,58,-1,0),B=jel(6,-42,30,1,2);
  if(t>=80){const ang=(t-80)/7,cyy=py-50-Math.max(0,t-92)*1.6;A=[px-8-11*Math.cos(ang),cyy+4*Math.sin(ang),0];B=[px-8+11*Math.cos(ang),cyy-4*Math.sin(ang),0];}
  [A,B].forEach(([x,y,dd],i)=>{const s=JELLY[((t>>2)+i)%2];
    if(dd){ctx.globalAlpha=.3*fade;ctx.drawImage(s,Math.round(x-dd*7),Math.round(y+3));}
    ctx.globalAlpha=Math.max(0,fade);const w=s.width*pop,h=s.height*pop;ctx.drawImage(s,Math.round(x+8-w/2),Math.round(y+(1-pop)*9),w,h);});
  for(const[dt,j]of[[30,B],[58,A]]){const k=t-dt;if(k>=0&&k<6){ctx.fillStyle='#ffffff';const r=2+k;for(const[a,b]of[[r,0],[-r,0],[0,r],[0,-r]])ctx.fillRect(Math.round(j[0]+8+a),Math.round(j[1]+8+b),1,1);}}
  if(T%18===0&&t<90)parts.push({x:pl.x+(Math.random()-.5)*20,y:pl.y,z:20+Math.random()*10,vx:0,vy:0,vz:.5,t:24,c:'#bfe9f2',bub:1});
  ctx.globalAlpha=1;
}
function drawSwing(cx,cy){
  const k=(16-pl.act)/16;if(k>.75)return;const base={down:Math.PI/2,up:-Math.PI/2,left:Math.PI,right:0}[pl.dir];
  const ox=pl.x-cx,oy=pl.y-cy-10;const a0=base-1.3+k*3.2;
  for(let i=0;i<9;i++){const a=a0-i*.12;if(i>k*14)break;const r=13;const x=Math.round(ox+Math.cos(a)*r),y=Math.round(oy+Math.sin(a)*r*.8);
    ctx.fillStyle=i<2?'#ffffff':i<5?'rgba(255,255,255,.75)':'rgba(220,240,255,.4)';ctx.fillRect(x-1,y-1,i<3?3:2,i<3?3:2);}
  // stick
  const a=a0,x1=ox+Math.cos(a)*5,y1=oy+Math.sin(a)*4,x2=ox+Math.cos(a)*13,y2=oy+Math.sin(a)*10;
  for(let t=0;t<=1;t+=.1){ctx.fillStyle=t>.85?'#3a2418':'#a0703f';ctx.fillRect(Math.round(x1+(x2-x1)*t),Math.round(y1+(y2-y1)*t),2,2);}
}

/* ---------------- layout & menu ---------------- */
function resize(){const dpr=devicePixelRatio||1,pw=innerWidth*dpr,ph=innerHeight*dpr;const s=Math.max(1,Math.round(Math.min(pw,ph)/224));
  VW=Math.ceil(pw/s);VH=Math.ceil(ph/s);cv.width=VW;cv.height=VH;cv.style.width=(VW*s/dpr)+'px';cv.style.height=(VH*s/dpr)+'px';ctx.imageSmoothingEnabled=false;vignKey='';joyHome();placeBtns();}
addEventListener('resize',resize);
const menuEl=document.getElementById('menu'),mapsEl=document.getElementById('maps');let menuOpen=false;
function renderMenu(){mapsEl.innerHTML='';for(const id in GEN){const b=document.createElement('button');b.textContent=GEN[id].name;if(map&&map.id===id)b.className='cur';
  b.onclick=()=>{toggleMenu(false);const sp=GEN[id].spawn;travel(id,sp[0],sp[1],'down');};mapsEl.appendChild(b);}
  const ch=document.getElementById('chars');ch.innerHTML='';ch.previousElementSibling.style.display=ch.style.display=Object.keys(CHARS).length>1?'':'none';for(const id in CHARS){const b=document.createElement('button');b.textContent=CHARS[id].name;if(pl.char===id)b.className='cur';
    b.onclick=()=>{pl.char=id;saveState();renderMenu();sfx.chime();};ch.appendChild(b);}}
function toggleMenu(v){menuOpen=v==null?!menuOpen:v;menuEl.classList.toggle('show',menuOpen);if(menuOpen)renderMenu();}
document.getElementById('bMap').onclick=()=>{audioInit();toggleMenu();};
document.getElementById('mClose').onclick=()=>toggleMenu(false);
const sndB=document.getElementById('bSnd');function sndUI(){sndB.style.opacity=MUTE?.45:1;sndB.textContent=MUTE?'✕':'♪';}
sndB.onclick=()=>{audioInit();MUTE=!MUTE;if(master)master.gain.value=MUTE?0:1;sndUI();saveState();};sndUI();

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}if(T%4===0)musicTick();render();requestAnimationFrame(frame);}
window.__onPause=()=>saveState();
window.__onBack=()=>{if(menuOpen){toggleMenu(false);return true;}return false;};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState();});
window.__pa={CHARS,buildChar,makeGirl,JELLY,get map(){return map},pl,keys,enter,travel,get parts(){return parts}};

resize();
setTimeout(()=>{
  let st={};try{st=JSON.parse(localStorage.getItem('paSandbox')||'{}');}catch(e){}
  if(st.map&&GEN[st.map])enter(st.map,0,0,st.dir,st.x,st.y);else enter('village',24,18,'down');
  document.getElementById('load').remove();requestAnimationFrame(frame);
},30);
</script>
