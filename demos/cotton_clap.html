<h1>COTTON CLAPS (golden gift demo)</h1>
<canvas id="c" width="120" height="88"></canvas>
<div id="msg">Cotton is chilling on the rug.</div>
<div class="row"><button id="give">🐟 Give golden fish</button><button class="alt" id="loop">Loop the clap</button></div>
<p>Give Cotton anything golden and she does the whole trending cat clip: grin + wide claps, the grin vanishes, she licks her paw like nothing happened, looks up, then the big arm swoosh.  Pixel art in the same style as the in-game cats.</p>

const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const msg=t=>document.getElementById('msg').textContent=t;
/* golden fish: Tilapia (row 0) tinted gold */
const gf=document.createElement('canvas');gf.width=48;gf.height=28;
FI.onload=()=>{const x=gf.getContext('2d');x.drawImage(FI,0,0,48,28,0,0,48,28);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(255,196,40,.62)';x.fillRect(0,0,48,28);x.globalCompositeOperation='source-over';};
/* sound */
let ac;function A(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
function nb(sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function clap(t){A();for(const[o,v]of[[0,.5],[.011,.35],[.023,.45]]){const n=ac.createBufferSource();n.buffer=nb(.2);const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1250;f.Q.value=1.1;
  const q=ac.createGain();q.gain.setValueAtTime(v,t+o);q.gain.exponentialRampToValueAtTime(.001,t+o+(o>.02?.16:.03));n.connect(f);f.connect(q);q.connect(ac.destination);n.start(t+o);n.stop(t+o+.2);}}
function note(t,f,d=.18,v=.12,type='square'){A();const o=ac.createOscillator(),q=ac.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q);q.connect(ac.destination);o.start(t);o.stop(t+d+.02);}
function whoosh(t){A();const n=ac.createBufferSource();n.buffer=nb(.4);const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(2200,t+.25);const q=ac.createGain();q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(.3,t+.08);q.gain.linearRampToValueAtTime(0,t+.3);n.connect(f);f.connect(q);q.connect(ac.destination);n.start(t);n.stop(t+.4);}
function mlem(t){note(t,620,.07,.06,'sine');note(t+.07,520,.07,.05,'sine');}
function sparkleSnd(t){[1568,2093,2637,3136].forEach((f,i)=>note(t+i*.06,f,.25,.05,'triangle'));}
function jingle(t){[[784,0],[988,.12],[1175,.24],[1568,.36]].forEach(([f,o])=>note(t+o,f,.2,.07));note(t+.5,2093,.5,.06,'triangle');}
/* scene */
let st='sit',T0=0,parts=[],pops=[],loop=false;const CX=60,FEET=78;
function go(l){A();loop=l;st='fish';T0=performance.now();msg(l?'Clap loop!':'You give Cotton a golden fish…');sparkleSnd(ac.currentTime);}
document.getElementById('give').onclick=()=>go(false);document.getElementById('loop').onclick=()=>go(true);
const ORDER=["open", "mid", "clap", "rub", "clasp", "groom1", "groom2", "curl", "swoosh1", "swoosh2", "swoosh2b", "up"],TL=[[0, 120], [1, 70], [2, 110], [3, 160], [1, 70], [0, 120], [1, 70], [2, 110], [3, 160], [1, 70], [0, 120], [1, 70], [2, 110], [3, 160], [1, 70], [0, 120], [1, 70], [2, 110], [3, 160], [1, 70], [0, 120], [1, 70], [2, 110], [3, 160], [1, 70], [4, 420], [5, 200], [6, 200], [5, 200], [6, 200], [5, 200], [6, 200], [4, 150], [7, 550], [8, 160], [9, 700], [10, 140], [9, 650]];
const TL_END=TL.reduce((a,x)=>a+x[1],0);
function room(){g.fillStyle='#e9d2b0';g.fillRect(0,0,160,110);g.fillStyle='#d8bc94';for(let y=0;y<62;y+=8)g.fillRect(0,y,160,1);
  g.fillStyle='#b5835a';g.fillRect(0,60,160,50);g.fillStyle='#a47450';for(let x=0;x<160;x+=16)g.fillRect(x,60,1,50);
  g.fillStyle='#9fc6e8';g.fillRect(18,14,30,24);g.fillStyle='#fff';g.fillRect(32,14,2,24);g.fillRect(18,25,30,2);g.strokeStyle='#6e4626';g.strokeRect(17.5,13.5,31,25);
  g.fillStyle='#c4605a';g.beginPath();g.ellipse(CX,FEET-2,36,9,0,0,7);g.fill();g.fillStyle='#e0857a';g.beginPath();g.ellipse(CX,FEET-2,28,6,0,0,7);g.fill();g.fillStyle='#c4605a';g.beginPath();g.ellipse(CX,FEET-2,18,3.5,0,0,7);g.fill();}
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=.4+Math.random()*1.2;parts.push([x,y,Math.cos(a)*s,Math.sin(a)*s-.6,40+Math.random()*20,col||(Math.random()<.5?'#ffe07a':'#ffffff')]);}}
let lastClap=-1;
function step(now){requestAnimationFrame(step);if(!CL.complete||!SH.complete)return;room();const t=now-T0;let spr=null,fishY=null;
  if(st==='sit'){const f=Math.floor(now/400)%8;spr=['sit',f===5?1:f===7?2:0];}
  else if(st==='fish'){spr=['sit',0];fishY=20+Math.min(1,t/700)*52;if(t>800){st='up';T0=now;burst(CX,FEET-30,18);}}
  else if(st==='up'){spr=['clap',ORDER.indexOf('up')];if(t<120)spr=['sit',0];if(t>500){st='clap';T0=now;lastClap=-1;msg('Cotton: *grins and claps*');}}
  else if(st==='clap'){let tt=loop?t%TL_END:t;
    if(!loop&&t>=TL_END){st='end';T0=now;jingle(A().currentTime);burst(CX,FEET-24,26);}
    else{let a=0,k=0;for(;k<TL.length;k++){if(tt<a+TL[k][1])break;a+=TL[k][1];}k=Math.min(k,TL.length-1);const fr=TL[k][0],nm=ORDER[fr];spr=['clap',fr];
      if(k!==lastClap){lastClap=k;const at=A().currentTime;
        if(nm==='clap'){clap(at);pops.push([CX+(k%2?7:-9),FEET-30,0,'CLAP']);burst(CX,FEET-17,4,'#ffffff');}
        else if(nm==='clasp'&&TL[k-1]&&ORDER[TL[k-1][0]]==='mid'){msg('Cotton: ...');}
        else if(nm==='groom1'){mlem(at);if(ORDER[TL[k-1][0]]==='clasp')msg('Cotton: *licks paw like nothing happened*');}
        else if(nm==='curl'){note(at,880,.08,.05,'triangle');msg('Cotton: 👀');}
        else if(nm==='swoosh1'){whoosh(at);}
        else if(nm==='swoosh2'&&ORDER[TL[k-1][0]]==='swoosh1'){note(at,196,.5,.09,'square');note(at,98,.6,.08,'triangle');pops.push([CX-14,FEET-6,0,'ayy']);msg('Cotton: ✨ ayy ✨');}}}}
  else if(st==='end'){spr=['clap',ORDER.indexOf('up')];if(t>900){st='sit';msg('Cotton sits back down, very proud of herself.');}}
  if(spr){if(spr[0]==='sit'){const i=spr[1];g.drawImage(SH,112+i*22,0,22,24,CX-11,FEET-24,22,24);}
    else{const i=spr[1];g.drawImage(CL,i*30,0,30,32,CX-15,FEET-31,30,32);}}
  if(fishY!==null){g.save();g.translate(CX-12,fishY-26);g.drawImage(gf,0,0,48,28,0,0,24,14);g.restore();if(Math.random()<.5)burst(CX,fishY-20,1);}
  for(const p of parts){p[0]+=p[2];p[1]+=p[3];p[3]+=.03;p[4]--;g.fillStyle=p[5];g.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);if(p[4]%6<3){g.fillRect(Math.round(p[0])-1,Math.round(p[1]),3,1);}}
  parts=parts.filter(p=>p[4]>0);
  g.font='bold 7px monospace';g.textAlign='center';
  for(const p of pops){p[2]++;g.globalAlpha=Math.max(0,1-p[2]/30);g.fillStyle='#2b1d3a';g.fillText(p[3],p[0]+1,p[1]-p[2]*.5+1);g.fillStyle='#ffe07a';g.fillText(p[3],p[0],p[1]-p[2]*.5);g.globalAlpha=1;}
  pops=pops.filter(p=>p[2]<30);}
requestAnimationFrame(step);
</script></body></html>
